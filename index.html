<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        h1 {
            color: rgb(10, 64, 12);
        }

        body {
            padding-top: 20px;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: "Roboto Mono", monospace;
            background: rgb(129, 144, 103);
        }

        .main {
            width: 1000px;
            height: 800px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-direction: column;
            color: rgb(10, 64, 12);
        }

        #output {
            width: 800px;
            height: 200px;
            box-shadow: rgba(177, 171, 134, 0.45) 0px 5px 15px;
            border-radius: 8px;
            background: rgb(254, 250, 224);
        }

        .outputin {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-direction: column;
        }

        .buttons {
            width: 1000px;
            height: 200px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;

        }

        .sel-btn {
            width: 150px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: rgba(177, 171, 134, 0.45) 0px 5px 15px;
            border-radius: 8px;
            background: rgb(254, 250, 224);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Calculator</h1>
    <div class="main">
        <div id="output">
            <div class="outputin">
                    <h1>WELCOME</h1>
                </div>
        </div>
        <div class="buttons">
            <div class="sel-btn" onclick="bmi()">BMI</div>
            <div class="sel-btn" onclick="intr()">Intrest</div>
            <div class="sel-btn" onclick="calo()">Calories</div>
        </div>
    </div>


    <script>
        var output = document.getElementById("output")

        function bmi() {
            var weight = prompt("Enter your body weight")
            var height = prompt("Enter your height in meters")

            var heisq = height * height;
            var bmi = weight / heisq;

            output.innerHTML = `
                <div class="outputin">
                    <h1>Your BMI Is</h1>
                    <h2>${bmi}</h2>
                </div>
            `
        }

        function intr() {
            var amount = prompt("Enter your principal amount")
            var time = prompt("Enter time period in months")
            var intrate = prompt("Enter your intrest rate")

            time = time / 12;
            var si = amount * time * intrate

            output.innerHTML = `
                <div class="outputin">
                    <h1>Your final amount with intrest Is</h1>
                    <h2>${si}</h2>
                </div>
            `

        }

        function calo() {
            var gen = prompt("what is your gender")
            var weight = prompt("Enter your body weight in kgs")
            var height = prompt("Enter your height in foot")
            var age = prompt("what is your age in years")

            weight = weight * 2.204;
            height = height * 12;

            if (gen == "male" || gen == "Male") {
                console.log("aldh")
                var calories = 655 + (4.35 * weight) + (4.7 * height) - (4.7 * age)
                output.innerHTML = `
                <div class="outputin">
                    <h1>Daily required calories are</h1>
                    <h2>${calories}</h2>
                </div>
            `
            } else if (gen == "female" || gen == "Female") {
                var calories = 66 + (6.23 * weight) + (12.7 * height) - (6.8 * age)
                output.innerHTML = `
                <div class="outputin">
                    <h1>Daily required calories are</h1>
                    <h2>${calories}</h2>
                </div>
            `
            }
        }



    </script>

</body>

</html>
